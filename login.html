<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SBS Karkala</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--secondary-color);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .admin-login-section {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            text-align: center;
        }

        .admin-login-prompt {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .admin-login-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            border-radius: 5px;
            background-color: transparent;
            text-decoration: none;
            transition: var(--transition);
        }

        .admin-login-link:hover {
            background-color: var(--primary-color);
            color: var(--white);
        }
    </style>
</head>

<body>

    <div class="login-page" style="position: relative;">
        <!-- Back Button -->
        <a href="index.html" class="back-btn">
            <i class="fas fa-home"></i> Back to Home
        </a>

        <div class="login-container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <img src="images/logo.png" alt="Logo" style="width: 80px; margin: 0 auto 1rem auto;">
                <h2 style="color: var(--primary-color); margin-bottom: 0.5rem;">Welcome Back</h2>
                <p style="color: #666; font-size: 0.9rem;">Sign in to access your dashboard</p>
            </div>

            <form id="loginForm" class="contact-form">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 5px; color: #333;">Staff ID or Student ID</label>
                    <input type="text" id="username" placeholder="Staff ID or Student ID" required>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 5px; color: #333;">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: #666;">
                <p>Forgot user ID or password? <a href="reset_password.html" style="color: var(--primary-color);">Reset Password</a></p>
            </div>

            <div class="admin-login-section">
                <p class="admin-login-prompt">Are you a school administrator?</p>
                <a href="login_admin.html" id="adminLoginLink" class="admin-login-link">
                    <i class="fas fa-shield-alt" aria-hidden="true"></i> Admin Login
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { getApiBase, verifyAdminSession, verifyCookieBackedSession } from './neon-auth-client.js';

        (async function checkExistingSession() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('reason') === 'auth_required' || params.get('reason') === 'teacher_only' || params.get('reason') === 'student_only') {
                sessionStorage.clear();
                return;
            }

            const cookieCheck = await verifyCookieBackedSession();
            if (cookieCheck.authenticated) {
                if (cookieCheck.role === 'teacher') {
                    window.location.replace('dashboard_teacher.html');
                    return;
                }
                if (cookieCheck.role === 'student') {
                    window.location.replace('dashboard_student.html');
                    return;
                }
            }

            const adminCheck = await verifyAdminSession();
            if (adminCheck.isAdmin) {
                window.location.replace('dashboard_admin.html');
                return;
            }

            sessionStorage.clear();
        })();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            if (user.toLowerCase() === 'admin') {
                alert('Administrator login has moved to login_admin.html.');
                return;
            }

            try {
                const response = await fetch(`${getApiBase()}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await response.json().catch(() => ({}));
                if (response.ok && data.success) {
                    if (data.authProvider === 'legacy') {
                        sessionStorage.clear();
                        alert('Legacy test accounts without Neon Managed Auth cannot open protected dashboards. Please sign in with a Neon-linked Staff ID or Student ID.');
                        return;
                    }
                    if (data.role === 'teacher') {
                        sessionStorage.setItem('role', 'teacher');
                        sessionStorage.setItem('teacher_name', data.teacher_name);
                        sessionStorage.setItem('staff_id', data.staff_id);
                        window.location.href = 'dashboard_teacher.html';
                        return;
                    } else if (data.role === 'student') {
                        sessionStorage.setItem('role', 'student');
                        sessionStorage.setItem('student_code', data.student_code);
                        sessionStorage.setItem('student_name', data.student_name);
                        sessionStorage.setItem('student_class', data.student_class || '');
                        sessionStorage.setItem('student_medium', data.student_medium || '');
                        window.location.href = 'dashboard_student.html';
                        return;
                    }
                }
                alert(data.error || 'Invalid ID or password.');
            } catch (err) {
                console.error('Login request failed:', err.message);
                alert('Unable to reach authentication server. Please verify the backend is running.');
            }
        });
    </script>
</body>

</html>
