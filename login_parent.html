<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student / Parent Portal | SBEI Karkala</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--secondary-color);
        }
    </style>
</head>

<body class="login-page">
    <a href="index.html" class="back-btn">
        <i class="fas fa-home"></i> Back to Home
    </a>

    <div class="login-box">
        <div style="text-align: center; margin-bottom: 2rem;">
            <img src="images/logo.png" alt="SBEI Logo" style="width: 80px; margin: 0 auto 1rem auto;">
            <a href="index.html"
                style="font-family: var(--font-heading); font-size: 1.5rem; color: var(--primary-color);">SBEI
                Karkala</a>
            <p>Student / Parent Portal</p>
        </div>

        <form class="contact-form" id="studentLoginForm">
            <div style="margin-bottom: 1rem; text-align: left;">
                <label style="display: block; margin-bottom: 5px;">Student ID</label>
                <div style="position: relative;">
                    <i class="fas fa-user" style="position: absolute; left: 10px; top: 12px; color: #999;"></i>
                    <input type="text" id="studentId" placeholder="e.g. C1-003" style="padding-left: 35px;" required>
                </div>
            </div>

            <div style="margin-bottom: 1rem; text-align: left;">
                <label style="display: block; margin-bottom: 5px;">Password</label>
                <div style="position: relative; margin-bottom: 15px;">
                    <i class="fas fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #999; z-index: 5;"></i>
                    <input type="password" id="studentPassword" placeholder="Enter Password" style="padding-left: 38px; padding-right: 48px; margin-bottom: 0;" required>
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('studentPassword', this)" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="loginError" style="display:none; color:#ea5455; font-size:0.85rem; margin-bottom:10px; text-align:center;"></div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Secure Login</button>

            <div style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                <a href="reset_password.html" style="color: var(--secondary-color);">Forgot Password?</a>
            </div>
        </form>

        <div style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem;">
            <p style="font-size: 0.8rem;">Are you a teacher?</p>
            <a href="login_admin.html" class="btn btn-outline"
                style="border-color: var(--primary-color); color: var(--primary-color); padding: 5px 15px; font-size: 0.8rem; margin-top: 5px;">Teacher
                Login</a>
        </div>

        <div style="margin-top: 1.5rem; padding: 10px; background: #f8f9fa; border-radius: 5px; font-size: 0.75rem; color: #888;">
            <p><strong>Standard Login:</strong> Use your Student ID (e.g. <code>C1-003</code>).<br>
            New students can click <strong>Forgot Password?</strong> to set their password via email OTP.</p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            } else {
                input.type = 'password';
                if (icon) {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            }
        }
    </script>
    <script type="module">
        import { getApiBase, verifyCookieBackedSession } from './neon-auth-client.js';

        (async function checkExistingStudentSession() {
            const errDiv = document.getElementById('loginError');
            const params = new URLSearchParams(window.location.search);
            const reason = params.get('reason');
            if (reason === 'auth_required' || reason === 'student_only') {
                sessionStorage.clear();
                if (reason === 'student_only' && errDiv) {
                    errDiv.textContent = 'Please sign in with your Student ID to access the Student Portal.';
                    errDiv.style.display = 'block';
                }
                return;
            }

            const check = await verifyCookieBackedSession({ expectedRole: 'student' });
            if (check.authorized) {
                window.location.replace('dashboard_student.html');
                return;
            }
            if (sessionStorage.getItem('role') === 'student') {
                sessionStorage.clear();
            }
        })();

        document.getElementById('studentLoginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var id = document.getElementById('studentId').value.trim();
            var pass = document.getElementById('studentPassword').value;
            var errDiv = document.getElementById('loginError');
            errDiv.style.display = 'none';

            try {
                const response = await fetch(`${getApiBase()}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: id, password: pass })
                });
                const data = await response.json().catch(() => ({}));
                if (response.ok && data.success && data.role === 'student') {
                    if (data.authProvider === 'legacy') {
                        sessionStorage.clear();
                        errDiv.textContent = 'Legacy dummy student accounts without Neon Managed Auth cannot open the protected dashboard. Sign in with a Neon-linked Student ID (e.g. C1-003).';
                        errDiv.style.display = 'block';
                        return;
                    }
                    sessionStorage.setItem('role', 'student');
                    sessionStorage.setItem('student_code', data.student_code);
                    sessionStorage.setItem('student_name', data.student_name);
                    sessionStorage.setItem('student_class', data.student_class || '');
                    sessionStorage.setItem('student_medium', data.student_medium || '');
                    if (data.token) sessionStorage.setItem('student_token', data.token);
                    window.location.href = 'dashboard_student.html';
                    return;
                }
                errDiv.textContent = data.error || 'Invalid ID or password.';
                errDiv.style.display = 'block';
            } catch (err) {
                console.error('Student login error:', err.message);
                errDiv.textContent = 'Unable to reach authentication server. Please verify the backend is running.';
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
